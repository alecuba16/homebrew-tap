name: Smoke test tap push

# Runs the same steps the herdr-webui release workflow uses to update the
# formula, so the HOMEBREW_TAP_TOKEN secret can be proven working without
# cutting a release. Pass a tag (e.g. v0.7.30); regenerating the current
# version commits nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the formula should target"
        required: true
        default: "v0.7.30"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          # Same fine-grained PAT the release repo will store: contents:write
          # on alecuba16/homebrew-tap only.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Regenerate formula for ${{ inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          chmod +x scripts/generate_formula.sh
          ./scripts/generate_formula.sh Formula/herdr-webui.rb "${{ inputs.tag }}"
          ruby -c Formula/herdr-webui.rb

      - name: Commit when changed
        run: |
          if git diff --quiet -- Formula/herdr-webui.rb; then
            echo "smoke: formula already at ${{ inputs.tag }}, nothing to commit"
            exit 0
          fi
          git config user.name "alecuba16-release-bot"
          git config user.email "actions@github.com"
          git add Formula/herdr-webui.rb
          git commit -m "herdr-webui ${{ inputs.tag }}"
          git push
